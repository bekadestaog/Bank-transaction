<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Banking Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🏦 Commercial Bank of Ethiopia</h1>

    <div class="card">
        <h2>Current Balance</h2>
        <h3>$<span id="balance">1000r</span></h3>
    </div>

    <div class="actions">
        <input type="number" id="amount" placeholder="Enter Amount">

        <button onclick="Galii()">Deposit</button>
        <button onclick="Baasii()">Withdraw</button>
    </div>

    <h2>Transactions</h2>

    <ul id="history"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
